name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Validate festival data
        run: npm run validate

      - name: Sync must be idempotent
        # Catches the most common data-PR mistake: editing festivals/<id>/
        # without committing the regenerated public/data and Android assets.
        run: |
          npm run lineup:sync
          if ! git diff --quiet; then
            echo "::error::Synced output is stale. Run 'npm run lineup:sync' and commit the result."
            git diff --stat
            exit 1
          fi

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        working-directory: android
        run: ./gradlew test --no-daemon
